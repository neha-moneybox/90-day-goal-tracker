<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>First 90 Days</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Public+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: a planning board. Rows are goal areas, columns are the 30/60/90-day horizons; summary strip on top. */
:root{
  --bg:#F3F6F5; --surface:#FFFFFF; --ink:#13211D; --muted:#55635F; --line:#D8E0DD; --accent:#0F6E5B; --accent-soft:#DCEFE9;
  --done:#1F7A4D; --done-bg:#E1F2E8; --prog:#2B5FA8; --prog-bg:#E2EBF8; --wait:#9A5B00; --wait-bg:#FBEBD2;
  --plan:#5B6662; --plan-bg:#ECEFEE; --idea:#6E4BA3; --idea-bg:#EDE6F7;
  --display:'Bricolage Grotesque', 'Trebuchet MS', sans-serif; --body:'Public Sans', Arial, sans-serif; --mono:'IBM Plex Mono', 'Courier New', monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0F1715; --surface:#17221F; --ink:#E6EEEB; --muted:#9DB0AA; --line:#2A3A36; --accent:#5CC3A6; --accent-soft:#1D3530;
  --done:#7FD3A4; --done-bg:#183326; --prog:#8DB5EE; --prog-bg:#1A2840; --wait:#F0B65E; --wait-bg:#3A2A12;
  --plan:#AEB9B5; --plan-bg:#232E2B; --idea:#BFA3EA; --idea-bg:#2B2140; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0F1715; --surface:#17221F; --ink:#E6EEEB; --muted:#9DB0AA; --line:#2A3A36; --accent:#5CC3A6; --accent-soft:#1D3530;
  --done:#7FD3A4; --done-bg:#183326; --prog:#8DB5EE; --prog-bg:#1A2840; --wait:#F0B65E; --wait-bg:#3A2A12;
  --plan:#AEB9B5; --plan-bg:#232E2B; --idea:#BFA3EA; --idea-bg:#2B2140; color-scheme:dark}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.5}
.wrap{max-width:1240px;margin:0 auto;padding-inline:20px;padding-block:28px 48px;display:flex;flex-direction:column;gap:24px}
header{display:flex;flex-wrap:wrap;gap:16px 32px;align-items:flex-end;justify-content:space-between}
h1{font-family:var(--display);font-weight:700;font-size:clamp(28px,4vw,40px);line-height:1.1;margin:0;text-wrap:balance}
.sub{color:var(--muted);margin:6px 0 0}
.clock{display:flex;flex-direction:column;gap:8px;min-width:260px}
.clock-top{display:flex;justify-content:space-between;align-items:baseline;gap:12px;font-family:var(--mono);font-size:13px;color:var(--muted)}
.clock-top b{font-family:var(--display);font-size:24px;color:var(--ink);font-weight:700}
.bar{height:8px;background:var(--line);border-radius:4px;overflow:hidden;position:relative}
.bar i{position:absolute;inset:0 auto 0 0;background:var(--accent);border-radius:4px}
.marks{display:flex;justify-content:space-between;font-family:var(--mono);font-size:11px;color:var(--muted)}
.start{display:flex;gap:8px;align-items:center;font-size:13px;color:var(--muted)}
.start input{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:2px 6px}
.summary{display:flex;flex-wrap:wrap;gap:8px}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:600;padding:3px 10px;border-radius:999px;white-space:nowrap}
.pill::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.s-done{color:var(--done);background:var(--done-bg)} .s-progress{color:var(--prog);background:var(--prog-bg)}
.s-waiting{color:var(--wait);background:var(--wait-bg)} .s-planned{color:var(--plan);background:var(--plan-bg)} .s-idea{color:var(--idea);background:var(--idea-bg)}
.summary .pill{font-size:13.5px;padding:5px 12px}
.board{display:grid;grid-template-columns:180px repeat(3,minmax(0,1fr));border:1px solid var(--line);border-radius:12px;background:var(--surface);overflow:hidden}
.hcell{padding:12px 14px;border-bottom:1px solid var(--line);font-family:var(--mono);font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);display:flex;flex-direction:column;gap:2px}
.hcell b{font-family:var(--display);font-size:20px;letter-spacing:0;text-transform:none;color:var(--ink)}
.hcell.now{background:var(--accent-soft)}
.area{padding:16px 14px;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:4px}
.area h2{font-family:var(--display);font-size:18px;margin:0;line-height:1.2}
.area p{margin:0;color:var(--muted);font-size:13px}
.cell{padding:12px;border-top:1px solid var(--line);border-left:1px solid var(--line);display:flex;flex-direction:column;gap:10px;min-width:0}
.cell.now{background:color-mix(in srgb,var(--accent-soft) 45%,transparent)}
.card{all:unset;box-sizing:border-box;cursor:pointer;display:flex;flex-direction:column;gap:6px;padding:12px;border:1px solid var(--line);border-radius:10px;background:var(--surface);transition:border-color .15s}
.card:hover,.card:focus-visible{border-color:var(--accent)} .card:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.card h3{margin:0;font-size:14.5px;font-weight:600;line-height:1.3}
.card .detail{margin:0;font-size:13px;color:var(--muted)}
.card .next{margin:0;font-size:12.5px;color:var(--ink);border-top:1px dashed var(--line);padding-top:6px}
.card .next span{font-family:var(--mono);font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;margin-right:4px}
.add{all:unset;cursor:pointer;font-size:13px;color:var(--accent);font-weight:600;padding:4px 2px;align-self:flex-start}
.add:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}
.empty-cell{font-size:12.5px;color:var(--muted);font-style:italic}
.notice{padding:14px 16px;border:1px dashed var(--line);border-radius:10px;color:var(--muted);background:var(--surface)}
dialog{border:1px solid var(--line);border-radius:14px;padding:0;background:var(--surface);color:var(--ink);width:min(560px,calc(100vw - 32px))}
dialog::backdrop{background:rgba(10,20,18,.45)}
form{display:flex;flex-direction:column;gap:14px;padding:22px}
form h2{font-family:var(--display);margin:0;font-size:22px}
label{display:flex;flex-direction:column;gap:5px;font-size:12.5px;font-weight:600;color:var(--muted)}
input,select,textarea{font:inherit;font-size:14.5px;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px 10px}
textarea{min-height:64px;resize:vertical}
.row{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.actions{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.actions .spacer{flex:1}
button.btn{font:inherit;font-weight:600;font-size:14px;border-radius:8px;padding:8px 14px;cursor:pointer;border:1px solid var(--line);background:var(--surface);color:var(--ink)}
button.primary{background:var(--accent);border-color:var(--accent);color:var(--surface)}
button.danger{color:#B4382F;border-color:transparent;background:transparent}
.err{color:#B4382F;font-size:13px;margin:0}
@media (max-width:820px){
  .board{display:flex;flex-direction:column}
  .hcell{display:none}
  .area{background:var(--accent-soft)}
  .cell{border-left:none}
  .cell::before{content:attr(data-h);font-family:var(--mono);font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
  .row{grid-template-columns:1fr}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<div class="wrap">
  <header>
    <div>
      <h1>First 90 Days</h1>
      <p class="sub">Neha Bose · UX Research, Moneybox · goals agreed with Hannah</p>
    </div>
    <div class="clock">
      <div class="clock-top"><span>Day <b id="dayNum">–</b> of 90</span><span id="dueText"></span></div>
      <div class="bar" aria-hidden="true"><i id="barFill" style="width:0%"></i></div>
      <div class="marks"><span>Start</span><span>30</span><span>60</span><span>90</span></div>
      <div class="start"><label for="startDate" style="flex-direction:row;align-items:center;gap:8px;font-weight:500">Start date <input type="date" id="startDate"></label></div>
    </div>
  </header>

  <div class="summary" id="summary" aria-live="polite"></div>
  <div id="notice" class="notice" hidden></div>
  <div class="board" id="board" aria-label="Goals by area and horizon"></div>
</div>

<dialog id="editor" aria-labelledby="edTitle">
  <form id="edForm" method="dialog">
    <h2 id="edTitle">Edit goal</h2>
    <label for="fTitle">Goal<input id="fTitle" required maxlength="140"></label>
    <div class="row">
      <label for="fArea">Area<select id="fArea"></select></label>
      <label for="fHorizon">By<select id="fHorizon"><option value="30">30 days</option><option value="60">60 days</option><option value="90">90 days</option></select></label>
      <label for="fStatus">Status<select id="fStatus"></select></label>
    </div>
    <label for="fDetail">What it covers<textarea id="fDetail" maxlength="1200"></textarea></label>
    <label for="fNext">Next step or blocker<textarea id="fNext" maxlength="600"></textarea></label>
    <p class="err" id="edErr" hidden></p>
    <div class="actions">
      <button type="button" class="btn danger" id="btnDelete">Delete</button>
      <span class="spacer"></span>
      <button type="button" class="btn" id="btnCancel">Cancel</button>
      <button type="submit" class="btn primary" id="btnSave">Save</button>
    </div>
  </form>
</dialog>

<script>
const AREAS = [
  {id:"delivery", name:"Project delivery", blurb:"Research that informs live product decisions"},
  {id:"capacity", name:"Capacity building", blurb:"Workflows and ways of working for the team"},
  {id:"influence", name:"Stakeholder influence & visibility", blurb:"Sharing work and making research easy to use"}
];
const STATUSES = [
  {id:"done", name:"Done"}, {id:"progress", name:"In progress"},
  {id:"planned", name:"Not started"}, {id:"idea", name:"Idea"}
];
const HORIZONS = ["30","60","90"];
let goals = [], startDate = "", db = null, editingId = null, confirmDelete = false;

const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const statusName = id => (STATUSES.find(s => s.id === id) || STATUSES[2]).name;

function dayInfo(){
  if(!startDate) return null;
  const s = new Date(startDate + "T00:00:00"), now = new Date();
  const day = Math.floor((now - s) / 86400000) + 1;
  return {day, start:s};
}
function renderClock(){
  const info = dayInfo();
  $("startDate").value = startDate || "";
  if(!info){ $("dayNum").textContent = "–"; $("dueText").textContent = "Set a start date"; $("barFill").style.width = "0%"; return; }
  const d = Math.max(0, info.day);
  $("dayNum").textContent = Math.min(d, 90);
  $("barFill").style.width = Math.min(100, d / 90 * 100) + "%";
  const next = HORIZONS.map(Number).find(h => h >= d);
  if(next){ const due = new Date(info.start); due.setDate(due.getDate() + next - 1);
    $("dueText").textContent = `${next}-day check-in ${due.toLocaleDateString("en-GB",{day:"numeric",month:"short"})}`; }
  else $("dueText").textContent = "90 days complete";
}
function currentHorizon(){ const i = dayInfo(); if(!i) return null; return HORIZONS.find(h => Number(h) >= i.day) || null; }

function renderSummary(){
  const counts = STATUSES.map(s => ({...s, n: goals.filter(g => g.status === s.id).length})).filter(s => s.n);
  $("summary").innerHTML = counts.length
    ? counts.map(s => `<span class="pill s-${s.id}">${s.n} ${esc(s.name.toLowerCase())}</span>`).join("")
    : "";
}
function renderBoard(){
  const now = currentHorizon();
  let html = `<div class="hcell"><span>Area</span></div>` + HORIZONS.map(h => `<div class="hcell ${h===now?"now":""}"><span>By</span><b>${h} days</b></div>`).join("");
  for(const a of AREAS){
    html += `<div class="area"><h2>${esc(a.name)}</h2><p>${esc(a.blurb)}</p></div>`;
    for(const h of HORIZONS){
      const items = goals.filter(g => g.area === a.id && String(g.horizon) === h).sort((x,y)=>(x.order??0)-(y.order??0));
      html += `<div class="cell ${h===now?"now":""}" data-h="By ${h} days">`;
      html += items.map(g => `<button class="card" data-id="${esc(g.id)}" aria-label="Edit: ${esc(g.title)}">
        <span class="pill s-${esc(g.status)}">${esc(statusName(g.status))}</span>
        <h3>${esc(g.title)}</h3>
        ${g.detail ? `<p class="detail">${esc(g.detail)}</p>` : ""}
        ${g.next ? `<p class="next"><span>Next</span>${esc(g.next)}</p>` : ""}
      </button>`).join("") || (db ? `<span class="empty-cell">Nothing set yet</span>` : "");
      if(db) html += `<button class="add" data-area="${a.id}" data-h="${h}">+ Add goal</button>`;
      html += `</div>`;
    }
  }
  $("board").innerHTML = html;
}
function render(){ renderClock(); renderSummary(); renderBoard(); }

function openEditor(goal, area, horizon){
  editingId = goal ? goal.id : null; confirmDelete = false;
  $("edTitle").textContent = goal ? "Edit goal" : "Add a goal";
  $("fTitle").value = goal?.title || "";
  $("fArea").value = goal?.area || area || "delivery";
  $("fHorizon").value = String(goal?.horizon || horizon || "30");
  $("fStatus").value = goal?.status || "planned";
  $("fDetail").value = goal?.detail || ""; $("fNext").value = goal?.next || "";
  $("btnDelete").hidden = !goal; $("btnDelete").textContent = "Delete";
  $("edErr").hidden = true;
  $("editor").showModal(); $("fTitle").focus();
}
$("fArea").innerHTML = AREAS.map(a => `<option value="${a.id}">${esc(a.name)}</option>`).join("");
$("fStatus").innerHTML = STATUSES.map(s => `<option value="${s.id}">${esc(s.name)}</option>`).join("");

$("board").addEventListener("click", e => {
  const card = e.target.closest(".card"); const add = e.target.closest(".add");
  if(card){ const g = goals.find(x => x.id === card.dataset.id); if(g && db) openEditor(g); }
  else if(add && db) openEditor(null, add.dataset.area, add.dataset.h);
});
$("btnCancel").addEventListener("click", () => $("editor").close());
function showErr(msg){ $("edErr").textContent = msg; $("edErr").hidden = false; }

$("edForm").addEventListener("submit", async e => {
  e.preventDefault();
  const title = $("fTitle").value.trim(); if(!title){ showErr("Give the goal a short name."); return; }
  const body = { title, area:$("fArea").value, horizon:$("fHorizon").value, status:$("fStatus").value,
    detail:$("fDetail").value.trim(), next:$("fNext").value.trim(), updated:new Date().toISOString() };
  try{
    if(editingId){ await db.doc("goals/" + editingId).update(body); }
    else { const maxOrder = Math.max(0, ...goals.map(g => g.order || 0)); await db.collection("goals").add({...body, order:maxOrder + 1}); }
    $("editor").close();
  }catch(err){ showErr(err?.code === "quota_exceeded" ? "The tracker is full. Delete an old goal first." : "Couldn't save just now. Try again in a moment."); }
});
$("btnDelete").addEventListener("click", async () => {
  if(!confirmDelete){ confirmDelete = true; $("btnDelete").textContent = "Click again to delete"; return; }
  try{ await db.doc("goals/" + editingId).delete(); $("editor").close(); }
  catch(err){ showErr("Couldn't delete just now. Try again in a moment."); }
});
$("startDate").addEventListener("change", async e => {
  startDate = e.target.value; render();
  if(db && startDate){ try{ await db.doc("settings/plan").set({start:startDate}); }catch(err){} }
});

render();
$("notice").hidden = false;
$("notice").textContent = "Loading your goals…";

(async () => {
  try{ db = await window.claude?.use?.("db"); }catch(e){ db = null; }
  if(!db){ $("notice").textContent = "Your goals load when this page is opened in Claude."; return; }
  db.doc("settings/plan").onSnapshot(s => { startDate = s.exists ? (s.data().start || "") : ""; render(); }, () => {});
  db.collection("goals").onSnapshot(snap => {
    goals = snap.docs.map(d => ({id:d.id, ...d.data()}));
    $("notice").hidden = goals.length > 0;
    if(!goals.length) $("notice").textContent = "No goals yet. Use “+ Add goal” in any column to add the first one.";
    render();
  }, () => { $("notice").hidden = false; $("notice").textContent = "Goals couldn't load. Reopen the page to try again."; });
})();
</script>

</body></html>
